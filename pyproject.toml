[project]
name = "picea"
version = "0.0.31"
description = "A lightweight python library for working with trees and biological sequence collections"
authors = [{ name = "Rens Holmer" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    'Development Status :: 3 - Alpha',
    'Natural Language :: English',
    'Operating System :: MacOS',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
    'Topic :: Utilities',
]
dependencies = ["numpy>=1.26", "matplotlib>=3.9"]

[project.urls]
Repository = "https://github.com/holmrenser/picea"

[dependency-groups]
dev = [
    "pytest>=8.2.1",
    "black>=24.4.2",
    "coverage[toml]>=7.5.3",
    "coveralls>=4.0.1",
    "ruff>=0.4.5",
]
docs = [
    "sphinx>=8",
    "myst-nb>=1.2",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.2",
    "jupytext>=1.16.2",
    "ipykernel>=6.29.4",
    "jupyterlab>=4.2.1",
    "scikit-learn>=1.5.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--verbose --doctest-modules"
testpaths = ["picea", "tests"]
python_classes = "*Tests"
python_functions = "test*"
python_files = "*tests.py"

[tool.coverage.run]
branch = true
command_line = "-m pytest"

[tool.coverage.report]
omit = ["tests/*", "*__init__.py"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
exclude = ['docs/*']
lint.select = [
    "E", # pycodestyle errors (settings from FastAPI, thanks, @tiangolo!)
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
]
lint.ignore = [
    "E501", # line too long, handled by black
    "C901", # too complex
    "C408", # allow explicit `dict` and `list` calls
    "B028", # don't want to always specify stacklevel for warnings
]
